name: Deploy Mobile to cPanel

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build project
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://pek-api-v2.ejabbing.com/api' }}

      - name: Archive production build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fcp-mobile-production-dist
          path: ./dist/

      - name: Deploy via FTP
        if: env.FTP_SERVER != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/ # Ajustez selon votre dossier cPanel

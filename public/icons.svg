<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pek-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D98A00" />
      <stop offset="100%" stop-color="#F5C432" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 15)">
    <!-- P -->
    <path d="M 95 160 V 315 M 95 160 H 160 C 195 160 195 235 160 235 H 95" 
          fill="none" stroke="#482010" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- E -->
    <path d="M 215 160 H 275 M 215 160 V 315 H 275 M 215 237 H 268" 
          fill="none" stroke="#482010" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- K stem & lower branch -->
    <path d="M 305 160 V 315 M 305 240 L 372 315" 
          fill="none" stroke="#482010" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- K upper branch leading to Arrow -->
    <path d="M 305 240 L 368 168" 
          fill="none" stroke="#482010" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Golden Arrow Shaft -->
    <path d="M 358 178 L 415 114" 
          fill="none" stroke="url(#pek-gold)" stroke-width="26" stroke-linecap="round" />

    <!-- Golden Arrow Head -->
    <path d="M 368 108 L 428 104 L 424 164 Z" 
          fill="url(#pek-gold)" />

    <!-- Golden Separator Line -->
    <line x1="85" y1="345" x2="428" y2="345" stroke="#F5C432" stroke-width="6" stroke-linecap="round" />

    <!-- Subtitle: PLAN D'ÉPARGNE KORI -->
    <text x="256" y="388" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="21" 
          fill="#482010" 
          letter-spacing="5" 
          text-anchor="middle">PLAN D'ÉPARGNE KORI</text>
  </g>
</svg>
